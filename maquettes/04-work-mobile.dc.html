<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anthony Mure — Work (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Inter+Tight:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3EEE4}
a{color:#1A1714;text-decoration:none}a:hover{color:#B8460B}
.mbtn{font:inherit;cursor:pointer;border:0;white-space:nowrap}
.hand{font-family:'Caveat',cursive;font-weight:700}
</style>
</helmet>
<div style="width: 390px; min-height: 4700px; background: #F3EEE4; color: #1A1714; font-family: 'Inter Tight', system-ui, sans-serif">

<header style="position: sticky; top: 0; z-index: 10; background: rgba(243,238,228,0.95); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
<a href="HomeMobile.dc.html" style="font-size: 17px; font-weight: 600">Anthony Mure</a>
<a href="HomeMobile.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #1A1714; color: #F3EEE4; font-size: 14px; font-weight: 500">Menu</a>
</header>

<main style="padding: 0 16px">
<h1 style="margin: 0; padding: 32px 0 20px; font-size: 64px; line-height: 0.92; font-weight: 600; letter-spacing: -0.045em; display: flex; align-items: flex-start"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" style="margin-right: 8px; transform: rotate(-12deg)"><path d="M12 1.5l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 15.7l-5.8 3.6 1.6-6.6L2.6 8.3l6.8-.5z" fill="#1D2BB8"></path></svg>Work<sup style="font-size: 18px; font-weight: 500; color: #B8460B; letter-spacing: 0; margin-left: 6px; vertical-align: top">{{count}}</sup></h1>

<div role="group" aria-label="Filter projects" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 24px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}"><button class="mbtn" type="button" onClick="{{f.pick}}" aria-pressed="true" style="padding: 0 16px; min-height: 44px; border-radius: 999px; font-size: 14px; font-weight: 500; background: #1D2BB8; color: #F3EEE4">{{f.label}}</button></sc-if>
<sc-if value="{{f.off}}" hint-placeholder-val="{{ true }}"><button class="mbtn" type="button" onClick="{{f.pick}}" aria-pressed="false" style="padding: 0 16px; min-height: 44px; border-radius: 999px; font-size: 14px; font-weight: 500; background: #E8E0D2; color: #4F473E">{{f.label}}</button></sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 32px">
<sc-for list="{{shown}}" as="p" hint-placeholder-count="6">
<a href="#" style="display: block">
<div style="aspect-ratio: 3 / 2; border-radius: 24px; background: {{p.tone}}; position: relative">
<span style="position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 999px; background: rgba(243,238,228,0.9); color: #1A1714">{{p.cat}}</span>
<sc-if value="{{p.sticker}}" hint-placeholder-val="{{ false }}"><span class="hand" style="position: absolute; top: 14px; right: 14px; font-size: 22px; padding: 2px 12px; border-radius: 999px; background: #1D2BB8; color: #F3EEE4; transform: rotate(8deg)">{{p.sticker}}</span></sc-if>
<sc-if value="{{p.video}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: #F26A1B; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#1A1714"></path></svg></span>
</sc-if>
</div>
<div style="padding-top: 12px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline">
<div>
<div style="font-size: 18px; font-weight: 600">{{p.title}}</div>
<div style="font-size: 14px; color: #6B6257; margin-top: 2px">{{p.sub}}</div>
</div>
<span style="font-size: 13px; color: #6B6257; white-space: nowrap">{{p.year}}</span>
</div>
</a>
</sc-for>
</div>

<section aria-labelledby="ctaw" style="margin-top: 72px; border-radius: 24px; background: #F26A1B; padding: 32px 24px; display: flex; flex-direction: column; gap: 24px">
<h2 id="ctaw" style="margin: 0; font-size: 34px; line-height: 1.02; font-weight: 600; letter-spacing: -0.04em">Interested? Let’s make something together.</h2>
<a href="#" style="display: flex; justify-content: center; align-items: center; min-height: 52px; border-radius: 999px; background: #1D2BB8; color: #F3EEE4; font-size: 16px; font-weight: 500">Get in touch →</a>
</section>
</main>

<footer style="padding: 40px 16px 32px; display: flex; flex-direction: column; gap: 16px; font-size: 14px; color: #6B6257">
<a href="#" style="color: #1A1714; font-weight: 500">mure.anthony@gmail.com</a>
<div style="display: flex; gap: 20px; flex-wrap: wrap">
<a href="#" style="color: #6B6257">Instagram</a>
<a href="#" style="color: #6B6257">YouTube</a>
<a href="#" style="color: #6B6257">LinkedIn</a>
<a href="#" style="color: #6B6257">Legal notice</a>
</div>
<span>© 2026 Anthony Mure</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":4700}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { filter: 'All' }; }
renderVals() {
const P = [
{ title: '[Bar name] — Poster series', sub: 'Graphic design · 60+ posters', year: '2023–26', cats: ['Graphic design'], tone: '#E9C3A2', sticker: '60+ posters!' },
{ title: 'New Balance 550', sub: 'Product film', year: '[Year]', cats: ['Video'], tone: '#C9B79F' },
{ title: '[Photo series]', sub: 'Photography · [Client]', year: '[Year]', cats: ['Photography'], tone: '#D8CCBA' },
{ title: 'Saint-Étienne', sub: 'Personal project · City film', year: '[Year]', cats: ['Video'], tone: '#1D2BB8' },
{ title: 'New beers launch', sub: '[Bar name] · Reel + photos', year: '[Year]', cats: ['Video', 'Photography'], tone: '#BFB2A1' },
{ title: 'Magners Cider', sub: 'Poster', year: '[Year]', cats: ['Graphic design'], tone: '#F0D3B6' },
{ title: 'Burger King cap', sub: 'Concept · Product video', year: '[Year]', cats: ['Video'], tone: '#D1C4B0' },
{ title: 'Saint-Étienne illustrations', sub: 'Illustration series', year: '2024', cats: ['Graphic design'], tone: '#E3D6C3' },
{ title: 'Padel event teaser', sub: 'Event · Teaser', year: '[Year]', cats: ['Video'], tone: '#C4B49C' },
{ title: '[Photo series]', sub: 'Photography · Personal', year: '[Year]', cats: ['Photography'], tone: '#2E2924' },
{ title: 'Video game night', sub: '[Bar name] · Reel', year: '[Year]', cats: ['Video'], tone: '#1D2BB8' },
{ title: 'Avamind', sub: '[Project type]', year: '[Year]', cats: ['Graphic design'], tone: '#E9C3A2' }
];
const f = this.state.filter;
const shown = P.filter((p) => f === 'All' || p.cats.indexOf(f) !== -1).map((p) => ({
...p, cat: p.cats.join(' · '), video: p.cats.indexOf('Video') !== -1
}));
const filters = ['All', 'Photography', 'Video', 'Graphic design'].map((label) => {
const on = label === f;
return { label, on, off: !on, pick: () => this.setState({ filter: label }) };
});
return { shown, filters, count: shown.length };
}
}
</script>
</body>
</html>
